[project]
name = "quanttrade-backend"
version = "0.1.0"
description = "QuantTrade backtesting API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
    "bcrypt==4.2.0",
    "passlib==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "pydantic[email]==2.9.2",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
    "celery==5.6.3",
    "redis==8.1.0",
    "scikit-learn==1.9.0",
    "alembic>=1.19.1",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "aiosqlite==0.22.1",
]
